[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contestforge-r"
version = "0.1.0"
description = "Generate, verify, and score programming-contest problems."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "ContestForge contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
contestforge = "contestforge_r.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
